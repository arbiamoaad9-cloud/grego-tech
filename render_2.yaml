services:
  - type: web
    name: grego-tech
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: tar -xzf app.tar.gz && npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: ADMIN_PASSWORD
        value: admin123456789
      - key: ADMIN_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        value: https://grego-tech.onrender.com
      - key: NEXT_PUBLIC_WHATSAPP
        value: "212648701885"
